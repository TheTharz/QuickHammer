spring.application.name=api-gateway

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

jwt.secret={JWT_SECRET}

server.port=${SERVER_PORT:5000}

# Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Service API Documentation URLs
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth-service/api-docs

springdoc.swagger-ui.urls[1].name=User Service
springdoc.swagger-ui.urls[1].url=/user-service/api-docs

springdoc.swagger-ui.urls[2].name=Job Service
springdoc.swagger-ui.urls[2].url=/job-service/api-docs

springdoc.swagger-ui.urls[3].name=Bid Service
springdoc.swagger-ui.urls[3].url=/bid-service/api-docs

springdoc.swagger-ui.urls[4].name=Notification Service
springdoc.swagger-ui.urls[4].url=/notification-service/api-docs

springdoc.swagger-ui.urls[5].name=Payment Service
springdoc.swagger-ui.urls[5].url=/payment-service/api-docs

# Security (for development)
spring.security.user.name=admin
spring.security.user.password=secret

management.endpoints.web.exposure.include=*
