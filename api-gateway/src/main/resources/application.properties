spring.application.name=api-gateway

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

jwt.secret={JWT_SECRET}

server.port=${SERVER_PORT:5000}

springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Auth Service
springdoc.swagger-ui.urls[1].url=/auth-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=Bid Service
springdoc.swagger-ui.urls[2].url=/bid-service/v3/api-docs

springdoc.swagger-ui.urls[3].name=Job Service
springdoc.swagger-ui.urls[3].url=/job-service/v3/api-docs

springdoc.swagger-ui.urls[4].name=Notification Service
springdoc.swagger-ui.urls[4].url=/notification-service/v3/api-docs

springdoc.swagger-ui.urls[5].name=Payment Service
springdoc.swagger-ui.urls[5].url=/payment-service/v3/api-docs
