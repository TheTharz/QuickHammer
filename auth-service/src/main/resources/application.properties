spring.application.name=auth-service
# ===========================
# Database
# ===========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Static values
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===========================
# Eureka
# ===========================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}


# ===========================
# JWT
# ===========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}


# ===========================
# Kafka
# ===========================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}


# ===========================
# Redis
# ===========================
redis.host=${REDIS_HOST}
redis.port=${REDIS_PORT:6379}
redis.timeout=${REDIS_TIMEOUT:2000ms}
redis.lettuce.pool.max-active=${REDIS_MAX_ACTIVE:8}
redis.lettuce.pool.max-idle=${REDIS_MAX_IDLE:8}
redis.lettuce.pool.min-idle=${REDIS_MIN_IDLE:0}


# ===========================
# Server
# ===========================
server.port=${SERVER_PORT:8080}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true