spring.application.name=auth-service
# ===========================
# Database
# ===========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Static values
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===========================
# Eureka
# ===========================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}


# ===========================
# JWT
# ===========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}


# ===========================
# Kafka
# ===========================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:kafka:9093}


# ===========================
# Redis
# ===========================
redis.host=${REDIS_HOST}
redis.port=${REDIS_PORT:6379}
redis.timeout=${REDIS_TIMEOUT:2000ms}
redis.lettuce.pool.max-active=${REDIS_MAX_ACTIVE:8}
redis.lettuce.pool.max-idle=${REDIS_MAX_IDLE:8}
redis.lettuce.pool.min-idle=${REDIS_MIN_IDLE:0}


# ===========================
# Server
# ===========================
server.port=${SERVER_PORT:8080}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=*
management.prometheus.metrics.export.enabled=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

# ===========================
# Circuit Breaker Configuration
# ===========================
# Interview Point: "These configurations control the circuit breaker behavior"

# Sliding window for tracking failures (count-based)
resilience4j.circuitbreaker.instances.userService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=10

# Open circuit if 50% of last 10 calls fail
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50

# Minimum number of calls before circuit breaker can calculate failure rate
resilience4j.circuitbreaker.instances.userService.minimumNumberOfCalls=5

# Wait 10 seconds before transitioning from OPEN to HALF_OPEN
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s

# In HALF_OPEN state, allow 3 test calls to check if service recovered
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=3

# Automatically transition from OPEN to HALF_OPEN
resilience4j.circuitbreaker.instances.userService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Slow call threshold - calls taking longer than 2s are considered slow
resilience4j.circuitbreaker.instances.userService.slowCallDurationThreshold=2s

# Open circuit if 60% of calls are slow
resilience4j.circuitbreaker.instances.userService.slowCallRateThreshold=60

# Which exceptions should be recorded as failures
resilience4j.circuitbreaker.instances.userService.recordExceptions=feign.FeignException,java.util.concurrent.TimeoutException,java.io.IOException

# Enable actuator endpoints for monitoring
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
