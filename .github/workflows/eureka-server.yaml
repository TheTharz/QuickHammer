name: Build & Push BId Service

on:
  push:
    branches:
      - main
    paths:
      - 'eureka-server/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push eureka-server
        run: |
          docker build \
            --build-arg GITHUB_TOKEN=${{ secrets.QUICK_HAMMER_PAT }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/quickhammer-eureka-server:latest \
            ./eureka-server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quickhammer-eureka-server:latest
