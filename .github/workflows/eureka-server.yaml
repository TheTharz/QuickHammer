name: Build & Push Eureka Server

on:
  push:
    branches:
      - main
    paths:
      - 'eureka-server/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push eureka-server
        run: |
          docker build \
            --build-arg GITHUB_TOKEN=${{ secrets.QUICK_HAMMER_PAT }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/quickhammer-eureka-server:latest \
            ./eureka-server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quickhammer-eureka-server:latest

      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Pulling latest configs..."
            cd /home/ubuntu/quickhammer_configs && git pull
            
            echo "Pulling latest eureka-server image..."
            cd /home/ubuntu/quickhammer_configs && docker compose pull eureka-server
            
            echo "Restarting eureka-server..."
            cd /home/ubuntu/quickhammer_configs && docker compose up -d eureka-server
            
            echo "Cleaning up unused images..."
            docker image prune -f