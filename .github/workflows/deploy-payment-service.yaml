name: Deploy Payment Service to Production

on:
  workflow_run:
    workflows: ["Build & Push Payment Service"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Pulling latest configs..."
            cd /home/ubuntu/quickhammer-configs && git pull
            
            echo "Pulling latest payment-service image..."
            cd /home/ubuntu/quickhammer && docker compose pull payment-service
            
            echo "Restarting payment-service..."
            cd /home/ubuntu/quickhammer && docker compose up -d payment-service
            
            echo "Cleaning up unused images..."
            docker image prune -f

