name: Build & Push Bid Service

on:
  push:
    branches:
      - main
    paths:
      - 'bid-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push bid-service
        run: |
          docker build \
            --build-arg GITHUB_TOKEN=${{ secrets.QUICK_HAMMER_PAT }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/quickhammer-bid-service:latest \
            ./bid-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quickhammer-bid-service:latest

      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Pulling latest configs..."
            cd /home/ubuntu/quickhammer-configs && git pull
            
            echo "Pulling latest bid-service image..."
            cd /home/ubuntu/quickhammer && docker compose pull bid-service
            
            echo "Restarting bid-service..."
            cd /home/ubuntu/quickhammer && docker compose up -d bid-service
            
            echo "Cleaning up unused images..."
            docker image prune -f