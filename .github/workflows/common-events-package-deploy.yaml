name: Publish Java Package

on:
  push:
    branches:
      - main # or your default branch

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          server-id: github # matches <id> in pom.xml
          server-username: ${{ secrets.USERNAME }}
          server-password: ${{ secrets.QUICK_HAMMER_PAT }}

      # Step 3: Build and deploy the submodule
      - name: Build and deploy common-events
        working-directory: common-events
        run: mvn clean deploy
