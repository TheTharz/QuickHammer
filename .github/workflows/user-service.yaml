name: Build & Push User Service

on:
  push:
    branches:
      - main
    paths:
      - 'user-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push user-service
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/quickhammer-user-service:latest \
            ./user-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quickhammer-user-service:latest
        env:
          GITHUB_TOKEN: ${{ secrets.QUICKHAMMER_WORKFLOW_TOKEN }}
