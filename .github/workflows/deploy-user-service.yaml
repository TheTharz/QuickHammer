name: Deploy User Service to Production

on:
  workflow_run:
    workflows: ["Build & Push User Service"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Pulling latest configs..."
            cd /home/ubuntu/quickhammer-configs && git pull
            
            echo "Pulling latest user-service image..."
            cd /home/ubuntu/quickhammer && docker compose pull user-service
            
            echo "Restarting user-service..."
            cd /home/ubuntu/quickhammer && docker compose up -d user-service
            
            echo "Cleaning up unused images..."
            docker image prune -f

