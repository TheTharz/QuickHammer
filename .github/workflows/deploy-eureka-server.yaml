name: Deploy Eureka Server to Production

on:
  workflow_run:
    workflows: ["Build & Push Eureka Server"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Pulling latest configs..."
            cd /home/ubuntu/quickhammer-configs
            git pull

            echo "Pulling latest eureka-server image..."
            cd /home/ubuntu/quickhammer
            docker compose pull eureka-server

            echo "Restarting eureka-server..."
            docker compose up -d eureka-server

            echo "Cleaning up unused images..."
            docker image prune -f

