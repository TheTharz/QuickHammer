services:
  # Infrastructure Services
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - quickhammer-network

  kafka:
    image: confluentinc/cp-kafka:7.2.2
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+IgnoreUnrecognizedVMOptions -XX:-UseContainerSupport"
    networks:
      - quickhammer-network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - quickhammer-network

  # Database Services
  auth-service-db:
    image: postgres:15
    container_name: auth-service-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - quickhammer-network

  bid-service-db:
    image: postgres:15
    container_name: bid-service-db
    environment:
      POSTGRES_DB: biddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - bid_data:/var/lib/postgresql/data
    networks:
      - quickhammer-network

  job-service-db:
    image: postgres:15
    container_name: job-service-db
    environment:
      POSTGRES_DB: jobdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - job_data:/var/lib/postgresql/data
    networks:
      - quickhammer-network

  notification-service-db:
    image: postgres:15
    container_name: notification-service-db
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5435:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    networks:
      - quickhammer-network

  payment-service-db:
    image: postgres:15
    container_name: payment-service-db
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5436:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    networks:
      - quickhammer-network

  user-service-db:
    image: postgres:15
    container_name: user-service-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5437:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    networks:
      - quickhammer-network

  # Eureka Server
  eureka-server:
    image: thetharz/quickhammer-eureka-server:latest
    container_name: eureka-server
    env_file:
      - /home/ubuntu/quickhammer_configs/eureka_server/.env
    ports:
      - "8761:8761"
    networks:
      - quickhammer-network
    restart: unless-stopped

  # Microservices
  auth-service:
    image: thetharz/quickhammer-auth-service:latest
    container_name: auth-service
    env_file:
      - /home/ubuntu/quickhammer_configs/auth_service/.env
    ports:
      - "8080:8080"
    depends_on:
      - auth-service-db
      - eureka-server
      - kafka
      - redis
    networks:
      - quickhammer-network
    restart: unless-stopped

  bid-service:
    image: thetharz/quickhammer-bid-service:latest
    container_name: bid-service
    env_file:
      - /home/ubuntu/quickhammer_configs/bid_service/.env
    ports:
      - "8081:8081"
    depends_on:
      - bid-service-db
      - eureka-server
      - kafka
    networks:
      - quickhammer-network
    restart: unless-stopped

  job-service:
    image: thetharz/quickhammer-job-service:latest
    container_name: job-service
    env_file:
      - /home/ubuntu/quickhammer_configs/job_service/.env
    ports:
      - "8082:8082"
    depends_on:
      - job-service-db
      - eureka-server
      - kafka
    networks:
      - quickhammer-network
    restart: unless-stopped

  notification-service:
    image: thetharz/quickhammer-notification-service:latest
    container_name: notification-service
    env_file:
      - /home/ubuntu/quickhammer_configs/notification_service/.env
    ports:
      - "8083:8083"
    depends_on:
      - notification-service-db
      - eureka-server
      - kafka
    networks:
      - quickhammer-network
    restart: unless-stopped

  payment-service:
    image: thetharz/quickhammer-payment-service:latest
    container_name: payment-service
    env_file:
      - /home/ubuntu/quickhammer_configs/payment_service/.env
    ports:
      - "8084:8084"
    depends_on:
      - payment-service-db
      - eureka-server
    networks:
      - quickhammer-network
    restart: unless-stopped

  user-service:
    image: thetharz/quickhammer-user-service:latest
    container_name: user-service
    env_file:
      - /home/ubuntu/quickhammer_configs/user_service/.env
    ports:
      - "8085:8085"
    depends_on:
      - user-service-db
      - eureka-server
      - kafka
      - redis
    networks:
      - quickhammer-network
    restart: unless-stopped

  api-gateway:
    image: thetharz/quickhammer-api-gateway:latest
    container_name: api-gateway
    env_file:
      - /home/ubuntu/quickhammer_configs/api_gateway/.env
    ports:
      - "5000:5000"
    depends_on:
      - eureka-server
    networks:
      - quickhammer-network
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - quickhammer-network
    restart: unless-stopped

networks:
  quickhammer-network:
    driver: bridge

volumes:
  auth_data:
  user_data:
  redis_data:
  job_data:
  bid_data:
  notification_data:
  payment_data:
